<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Star Hopper</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121212" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      user-select: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.25rem; color: #ffd700; }
    .btn-group { display: flex; gap: 8px; }
    button {
      background: #2a2a2a;
      color: #ffd700;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { background: #383838; }
    #status {
      text-align: center;
      margin: 24px 0;
      color: #888;
      font-size: 0.95rem;
    }
    .star-card {
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .star-card:active {
      background: #2d2d2d;
      border-color: #ffd700;
    }
    .world-col { font-size: 1.3rem; font-weight: bold; color: #fff; }
    .tier-badge {
      display: inline-block;
      font-size: 0.75rem;
      background: #332b00;
      color: #ffd700;
      border: 1px solid #665500;
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: 6px;
    }
    .loc-sub { font-size: 0.85rem; color: #aaa; margin-top: 4px; }
    .time-col { font-size: 0.95rem; font-weight: 600; color: #76c7c0; }
  </style>
</head>
<body>

  <header>
    <h1>★ Star Hopper</h1>
    <div class="btn-group">
      <button id="notify-btn" onclick="pinStarsToShade()">Pin to Tray</button>
      <button id="refresh-btn" onclick="loadStars()">Refresh</button>
    </div>
  </header>

  <div id="status">Loading stars...</div>
  <div id="star-list"></div>

  <script>
    const WORKER_URL = "https://osrs-star-proxy.windvampireeast.workers.dev/";

    const allowedLocations = [
      "Chambers of Xeric bank",
      "Myths' Guild",
      "Nardah bank",
      "Theatre of Blood bank",
      "West of Grand Tree",
      "Prifddinas Zalcano entrance"
    ];

    let currentMatchedStars = [];

    // Register minimal Service Worker required for native Android notifications
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(err => {
        console.warn("ServiceWorker registration failed:", err);
      });
    }

    function normalize(str) {
      return (str || "")
        .toLowerCase()
        .replace(/[’']/g, "'")
        .replace(/\s+/g, " ")
        .trim();
    }

    const normalizedAllowed = allowedLocations.map(normalize);

    async function onStarTapped(world) {
      try {
        await navigator.clipboard.writeText(world.toString());
      } catch (err) {
        console.warn("Clipboard failed", err);
      }

      const intentUri = 
        "intent:#Intent;" +
        "component=com.jagex.oldscape.android/com.jagex.oldscape.android.AndroidLauncher;" +
        "action=android.intent.action.MAIN;" +
        "category=android.intent.category.LAUNCHER;" +
        "end;";

      window.location.href = intentUri;
    }

    // Sends the current active stars straight into your swipe-down notification shade
    async function pinStarsToShade() {
      if (!("Notification" in window) || !("serviceWorker" in navigator)) {
        alert("Notifications are not supported in this browser mode.");
        return;
      }

      let permission = Notification.permission;
      if (permission !== "granted") {
        permission = await Notification.requestPermission();
      }

      if (permission !== "granted") {
        alert("Notification permission denied. Please allow notifications in site settings.");
        return;
      }

      try {
        const registration = await navigator.serviceWorker.ready;

        let summaryText = "No stars active at your 6 locations right now.";
        if (currentMatchedStars.length > 0) {
          summaryText = currentMatchedStars.slice(0, 3).map(s => 
            `W${s.world} (T${s.tier}) - ${s.location} [${s.time}]`
          ).join("\n");
        }

        await registration.showNotification("Active Safe Stars", {
          body: summaryText,
          icon: "icon-192.png",
          badge: "icon-192.png",
          tag: "osrs-star-summary",
          renotify: true
        });
      } catch (err) {
        alert("Could not display notification: " + err.message);
        console.error(err);
      }
    }

    async function loadStars() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("star-list");

      try {
        statusEl.innerText = "Checking active stars...";
        statusEl.style.display = "block";
        listEl.innerHTML = "";

        const res = await fetch(WORKER_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);

        const json = await res.json();

        let rawList = [];
        if (Array.isArray(json)) {
          rawList = json;
        } else {
          for (const key of Object.keys(json)) {
            if (Array.isArray(json[key])) {
              rawList = json[key];
              break;
            }
          }
        }

        currentMatchedStars = [];

        for (const item of rawList) {
          const rawLocation = item.loc || item.location || "";
          const world = item.world || item.worldNumber || "-";
          const tier = item.tier || "-";
          const timeVal = item.time !== undefined ? `${item.time}m` : (item.minTime ? `${item.minTime}m` : "-");

          const norm = normalize(rawLocation);
          const matchIndex = normalizedAllowed.findIndex(allowed => norm.includes(allowed) || allowed.includes(norm));
          
          if (matchIndex !== -1) {
            currentMatchedStars.push({
              world,
              tier,
              location: allowedLocations[matchIndex],
              time: timeVal
            });
          }
        }

        if (currentMatchedStars.length === 0) {
          statusEl.innerText = `Checked ${rawList.length} global stars. None active at your 6 locations right now.`;
          statusEl.style.display = "block";
          return;
        }

        statusEl.style.display = "none";
        const top5 = currentMatchedStars.slice(0, 5);

        listEl.innerHTML = top5.map(star => `
          <div class="star-card" onclick="onStarTapped('${star.world}')">
            <div>
              <span class="world-col">W${star.world}</span>
              <span class="tier-badge">T${star.tier}</span>
              <div class="loc-sub">${star.location}</div>
            </div>
            <div class="time-col">${star.time}</div>
          </div>
        `).join("");

      } catch (err) {
        statusEl.innerText = "Error: " + err.message;
        statusEl.style.display = "block";
        console.error("Star loading failed:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", loadStars);
  </script>
</body>
</html>
